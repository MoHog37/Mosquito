<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางช่วยกรอกรายงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fa;--card:#fff;--tx:#1d1a24;--mut:#6b6478;--pri:#6f22b8;--line:#e3deec;--hd:#efe8fa;--warn:#fff3d6;--warntx:#7a5200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121b;--card:#201b29;--tx:#f0ecf6;--mut:#a79fb6;--pri:#b98af0;--line:#352d44;--hd:#2c2340;--warn:#3b2f12;--warntx:#f2d28a}}
:root[data-theme="dark"]{--bg:#15121b;--card:#201b29;--tx:#f0ecf6;--mut:#a79fb6;--pri:#b98af0;--line:#352d44;--hd:#2c2340;--warn:#3b2f12;--warntx:#f2d28a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.25rem;margin:8px 0}
nav{display:flex;gap:8px;margin:8px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sec{display:none}.sec.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.card h2{font-size:1rem;margin:0;padding:10px 12px;background:var(--hd);color:var(--pri)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:.95rem}
th{background:var(--hd);font-weight:600}
td.l,th.l{text-align:left}
td.n{font-weight:600;font-size:1.05rem}
tr.tot td{background:var(--hd);font-weight:600}
tr.chk{cursor:pointer}
tr.done td{opacity:.45;text-decoration:line-through}
.cb{width:22px;height:22px;accent-color:var(--pri)}
.note{background:var(--warn);color:var(--warntx);padding:10px 12px;border-radius:10px;font-size:.9rem;margin:0 0 12px}
.sub{color:var(--mut);font-size:.85rem}
.q{background:var(--warn);color:var(--warntx);border-radius:6px;padding:0 6px;font-size:.75rem;margin-left:4px}
</style>
</head>
<body>
<main>
<h1>ตารางช่วยกรอกรายงาน</h1>
<nav>
<button class="on" data-t="a">รายงานลูกน้ำยุงลาย</button>
<button data-t="b">รายงาน อสม. 1</button>
</nav>

<section class="sec on" id="a">
<div class="note">อ่านจากลายมือในกระดาษ ป้าย “เช็ค” คือแถวที่เรียงไม่ตรงกับเลขบ้านชัดเจน (บ้าน 8 และ 9 ฝั่งในบ้านเป็น “น้ำใช้ 1” เหมือนกันทั้งคู่) ส่วน 960/13 ที่เขียนขีดฆ่าไว้กลางหน้าไม่นับ ใช้ 960/13 ที่เขียนใหม่ท้ายกระดาษแทน</div>
<div class="card"><h2>สรุปรวมทั้งหมู่</h2><div class="scroll"><table id="sumT"></table></div></div>
<div class="card"><h2>รายบ้าน (เลขบ้าน 960/…) <span class="sub">แตะแถวเพื่อติ๊กว่ากรอกแล้ว</span></h2>
<div class="scroll"><table id="houseT"></table></div></div>
</section>

<section class="sec" id="b"></section>
</main>

<script>
// ---------- ลูกน้ำยุงลาย: [บ้าน, ในบ้าน น้ำดื่ม, น้ำใช้, แจกัน, นอกบ้าน น้ำดื่ม, น้ำใช้, ต้องเช็ค]
const H=[
[1,2,0,0,0,1,0],[2,1,0,0,0,0,0],[3,2,0,0,1,0,0],[4,2,1,0,0,0,0],
[5,2,3,0,0,0,0],[6,2,1,0,0,0,0],[7,2,1,0,0,0,0],[8,0,1,0,0,1,1],
[9,0,1,0,0,0,1],[10,2,1,2,0,0,0],[11,1,3,4,0,4,0],[12,1,1,0,0,0,0],
[13,0,1,0,2,0,0],[14,1,1,2,0,0,0]];
const v=x=>x?x:'–';
let tot=[0,0,0,0,0];
let rows='<tr><th rowspan="2">บ้าน</th><th colspan="3">ในบ้าน</th><th colspan="2">นอกบ้าน</th><th rowspan="2">✔</th></tr><tr><th>น้ำดื่ม</th><th>น้ำใช้</th><th>แจกัน</th><th>น้ำดื่ม</th><th>น้ำใช้</th></tr>';
H.forEach(r=>{for(let i=0;i<5;i++)tot[i]+=r[i+1];
rows+=`<tr class="chk" data-k="h${r[0]}"><td class="l">960/${r[0]}${r[6]?'<span class="q">เช็ค</span>':''}</td><td class="n">${v(r[1])}</td><td class="n">${v(r[2])}</td><td class="n">${v(r[3])}</td><td class="n">${v(r[4])}</td><td class="n">${v(r[5])}</td><td><input type="checkbox" class="cb"></td></tr>`});
rows+=`<tr class="tot"><td class="l">รวม</td><td>${tot[0]}</td><td>${tot[1]}</td><td>${tot[2]}</td><td>${tot[3]}</td><td>${tot[4]}</td><td></td></tr>`;
document.getElementById('houseT').innerHTML=rows;
document.getElementById('sumT').innerHTML=`<tr><th class="l">ประเภทภาชนะ</th><th>ในบ้าน</th><th>นอกบ้าน</th></tr>
<tr><td class="l">น้ำดื่ม</td><td class="n">${tot[0]}</td><td class="n">${tot[3]}</td></tr>
<tr><td class="l">น้ำใช้</td><td class="n">${tot[1]}</td><td class="n">${tot[4]}</td></tr>
<tr><td class="l">แจกัน</td><td class="n">${tot[2]}</td><td class="n">–</td></tr>
<tr class="tot"><td class="l">รวม</td><td>${tot[0]+tot[1]+tot[2]}</td><td>${tot[3]+tot[4]}</td></tr>`;

// ---------- อสม. 1 (เฉพาะรายการที่ไม่เป็น 0)
const A=[
["หน้า 1 · การส่งเสริมสุขภาพ",[["อสม.เยี่ยมบ้านและให้คำแนะนำผู้สูงอายุด้านการดูแลสุขภาพ",8]]],
["หน้า 2 · การเฝ้าระวัง ป้องกัน และควบคุมโรค",[
["เฝ้าระวัง ป้องกัน ควบคุมโรคไข้เลือดออก (ปิด เปลี่ยน ปล่อย ปรับปรุง ปฏิบัติเป็นนิสัย)",14],
["เฝ้าระวัง ป้องกัน ควบคุมโรคไข้หวัดใหญ่ (ปิด ล้าง เลี่ยง หยุด)",14],
["เฝ้าระวัง คัดกรอง และให้คำแนะนำกลุ่มเสี่ยงโรค (เบาหวาน ความดันโลหิตสูง มะเร็ง หัวใจ หลอดเลือดสมอง)",8],
["ให้คำแนะนำประชาชนบริโภคผลิตภัณฑ์/อาหาร/เกลือที่ผสมไอโอดีน",14],
["ให้คำแนะนำประชาชนลดกินหวาน อาหารมันและเค็ม",14]]],
["หน้า 3 · การฟื้นฟูสุขภาพ",[["เยี่ยมบ้าน ให้คำแนะนำการดูแลผู้ป่วยโรคเบาหวาน ความดันโลหิต มะเร็ง หัวใจ ฯลฯ",4]]],
["หน้า 4 · การคุ้มครองผู้บริโภค",[["เฝ้าระวังและให้คำแนะนำการบริโภคอาหารปลอดภัย",4]]],
["หน้า 5 · การจัดการสุขภาพชุมชน และการมีส่วนร่วมในแผนสุขภาพตำบล",[
["อสม.ร่วมกิจกรรมจิตอาสากับเครือข่ายอื่น",4],
["จัดทำแผนสุขภาพ จัดหางบประมาณ จัดกิจกรรมสุขภาพและประเมินผล",4]]],
["หน้า 6 · การสนับสนุนอาสาสมัครประจำครอบครัว (อสค.)",[["กลุ่มผู้ป่วยโรคไม่ติดต่อเรื้อรัง",1]]],
["หน้า 7 · การใช้ยาอย่างสมเหตุสมผล / การบริโภคผลิตภัณฑ์สุขภาพ",[
["ให้ความรู้พื้นฐานการใช้ยาปฏิชีวนะ หรือข้อควรระวังการซื้อยากินเองสำหรับโรคหวัด/ท้องเสีย และการใช้สมุนไพรที่เสี่ยงต่อการผสมสาร สเตียรอยด์",14],
["เฝ้าระวังและให้คำแนะนำการบริโภคผลิตภัณฑ์สุขภาพ และร่วมสำรวจร้านชำในชุมชน เพื่อปลอดยาปฏิชีวนะ ยาชุด",2]]],
["หน้า 8 · การเข้าร่วมกับทีมหมอครอบครัว",[
["ร่วมเป็นทีมหมอครอบครัว ในการช่วยเหลือ ดูแลผู้ป่วยและครอบครัวในชุมชน",14],
["ช่วยปรับปรุงที่อยู่อาศัย และสิ่งแวดล้อมให้เอื้อต่อการดูแล การพยาบาล",14]]],
["หน้าสุดท้าย · กิจกรรมอื่นๆ",[["ชวนคนเลิกบุหรี่ (3 ราย: นายสงวน สมคิด บ้าน 960/5, นายนิรุต สมคิด บ้าน 960/9, นายจำเนือร น้อยบัวงาม บ้าน 960/10 · สถานะ: สูบ)",3]]]
];
let h='<div class="note">แสดงเฉพาะหัวข้อที่ไม่เป็น 0 · แตะแถวเพื่อติ๊กว่ากรอกแล้ว</div>';
A.forEach((s,i)=>{h+=`<div class="card"><h2>${s[0]}</h2><div class="scroll"><table><tr><th class="l">หัวข้อ</th><th>จำนวน</th><th>✔</th></tr>`;
s[1].forEach((r,j)=>{h+=`<tr class="chk" data-k="a${i}_${j}"><td class="l">${r[0]}</td><td class="n">${r[1]}</td><td><input type="checkbox" class="cb"></td></tr>`});
h+='</table></div></div>'});
document.getElementById('b').innerHTML=h;

// ---------- tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
try{localStorage.setItem('tab',b.dataset.t)}catch(e){}});
try{const t=localStorage.getItem('tab');if(t){document.querySelector(`nav button[data-t="${t}"]`).click()}}catch(e){}

// ---------- tick progress
let st={};try{st=JSON.parse(localStorage.getItem('done')||'{}')}catch(e){}
document.querySelectorAll('tr.chk').forEach(tr=>{
const cb=tr.querySelector('input'),k=tr.dataset.k;
const ap=()=>{tr.classList.toggle('done',cb.checked)};
cb.checked=!!st[k];ap();
tr.onclick=e=>{if(e.target!==cb)cb.checked=!cb.checked;st[k]=cb.checked;ap();try{localStorage.setItem('done',JSON.stringify(st))}catch(e){}};
});
</script>
</body>
</html>
